<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Знайомства</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #111418);
  --bg2: var(--tg-theme-secondary-bg-color, #1b2026);
  --text: var(--tg-theme-text-color, #f2f4f6);
  --hint: var(--tg-theme-hint-color, #8d97a3);
  --accent: var(--tg-theme-button-color, #e0446a);
  --accent-text: var(--tg-theme-button-text-color, #fff);
  --line: color-mix(in srgb, var(--text) 12%, transparent);
  --like: #ff4d6d; --skip: #8d97a3;
  --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  --safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));
  --vh: var(--tg-viewport-stable-height, 100dvh);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
body { display: flex; flex-direction: column; height: var(--vh); padding-top: var(--safe-top); overflow: hidden; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, textarea, select { font: inherit; color: var(--text); background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; user-select: text; -webkit-user-select: text; }
textarea { resize: none; min-height: 96px; }
.view { flex: 1; min-height: 0; display: none; flex-direction: column; }
.view.on { display: flex; }
.scroll { flex: 1; overflow-y: auto; padding: 14px 16px 20px; -webkit-overflow-scrolling: touch; }

/* стрічка */
#feed { padding: 8px 8px 0; }
.stage { flex: 1; min-height: 0; position: relative; }
.card { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; background: #000; touch-action: none; will-change: transform; }
.card img, .card video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.bars { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; }
.bars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35); }
.bars i.on { background: #fff; }
.info-btn { position: absolute; top: 18px; right: 12px; z-index: 3; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.38); color: #fff; font-size: 18px; display: grid; place-items: center; backdrop-filter: blur(6px); }
.badge-in { position: absolute; top: 18px; left: 12px; z-index: 3; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,77,109,.9); display: grid; place-items: center; font-size: 17px; }
.actions { display: flex; justify-content: center; gap: 34px; padding: 12px 0 calc(10px + var(--safe-bottom)); }
.round { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; background: var(--bg2); box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.round:active { transform: scale(.94); }
.round.like { background: var(--like); }
.stage > .empty { position: absolute; inset: 0; }
.scroll > .empty { min-height: 100%; }
.empty { flex: 1; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--hint); }
.empty b { display: block; color: var(--text); font-size: 20px; margin-bottom: 6px; }
.loader { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* таби */
.tabs { display: flex; border-top: 1px solid var(--line); background: var(--bg); padding-bottom: var(--safe-bottom); }
.tabs button { flex: 1; padding: 8px 0 7px; display: grid; justify-items: center; gap: 1px; color: var(--hint); font-size: 11.5px; position: relative; }
.tabs button span { font-size: 21px; line-height: 1.1; filter: grayscale(1); opacity: .7; }
.tabs button.on { color: var(--text); }
.tabs button.on span { filter: none; opacity: 1; }
.tabs .dot { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--like); color: #fff; font: 700 11px/17px system-ui; }

/* аркуші */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; display: none; }
.sheet-bg.on { display: block; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86%; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 10px 18px calc(18px + var(--safe-bottom)); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
h2 { margin: 0 0 4px; font-size: 22px; }
.muted { color: var(--hint); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chip { background: var(--bg2); border-radius: 999px; padding: 5px 11px; font-size: 14px; }
.about { white-space: pre-wrap; word-break: break-word; margin: 10px 0 14px; }
.note { background: color-mix(in srgb, var(--like) 15%, var(--bg2)); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
.btn { display: block; width: 100%; padding: 13px; border-radius: 12px; background: var(--bg2); font-weight: 600; text-align: center; margin-top: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-text); }
.btn.danger { color: #ff6b6b; }
.list-btn { display: block; width: 100%; text-align: left; padding: 12px 4px; border-bottom: 1px solid var(--line); }

/* лайки, симпатії */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cell { border-radius: 14px; overflow: hidden; background: var(--bg2); text-align: left; }
.cell .ph { aspect-ratio: 3/4; background: #000; }
.cell .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cell .t { padding: 7px 10px 9px; font-size: 14px; }
.big { font-size: 46px; font-weight: 800; line-height: 1; margin: 18px 0 6px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row img { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; background: var(--bg2); }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; }
.pill { padding: 8px 14px; border-radius: 999px; background: var(--accent); color: var(--accent-text); font-weight: 600; font-size: 14px; white-space: nowrap; }

/* преміум */
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; margin: 12px 0 4px; }
.plan { position: relative; border-radius: 14px; background: var(--bg2); border: 1.5px solid var(--line); padding: 14px 6px 10px; text-align: center; }
.plan:active { transform: scale(.97); }
.plan.best { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg2)); }
.plan b { display: block; font-size: 21px; line-height: 1.1; }
.plan .pt { display: block; font-size: 14px; margin-bottom: 2px; font-weight: 600; }
.plan small { display: block; color: var(--hint); font-size: 11.5px; margin-top: 2px; }
.plan em { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 10.5px; font-weight: 700; background: var(--accent); color: var(--accent-text); padding: 1px 8px; border-radius: 8px; white-space: nowrap; }
.plan[disabled] { opacity: .5; }
.prem-on { background: color-mix(in srgb, var(--accent) 14%, var(--bg2)); border-radius: 14px; padding: 12px 14px; margin: 8px 0; }
.linkish { color: var(--hint); text-decoration: underline; font-size: 13px; display: inline-block; margin-top: 6px; }

/* підтримка */
.sup-log { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto; padding: 4px 0 10px; }
.bub { max-width: 82%; padding: 9px 12px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; font-size: 15px; user-select: text; -webkit-user-select: text; }
.bub small { display: block; font-size: 11px; opacity: .65; margin-top: 3px; }
.bub.me { align-self: flex-end; background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 5px; }
.bub.adm { align-self: flex-start; background: var(--bg2); border-bottom-left-radius: 5px; }
.bub.adm b { display: block; font-size: 12px; color: var(--accent); margin-bottom: 2px; }
.badge-n { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; background: var(--like); color: #fff; font: 700 12px/20px system-ui; }

/* профіль */
.me-photo { width: 100%; aspect-ratio: 3/4; max-height: 52vh; object-fit: cover; border-radius: 16px; background: var(--bg2); display: block; }
.field { margin: 12px 0; }
.field label { display: block; font-size: 13px; color: var(--hint); margin: 0 0 5px 2px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); gap: 12px; }
.toggle small { display: block; color: var(--hint); }
.sw { width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; }
.sw.on { background: var(--accent); }
.sw.on::after { left: 23px; }
/* реєстрація */
.wiz { position: absolute; inset: 0; overflow-y: auto; padding: 14px 10px 20px; display: flex; flex-direction: column; }
.wiz h2 { margin: 18px 0 14px; font-size: 26px; }
.wbody { flex: 1; }
.wbar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.wbar i { display: block; height: 100%; background: var(--accent); }
.wback { color: var(--hint); margin-top: 10px; align-self: flex-start; }
.lbl { margin: 16px 2px 4px; font-weight: 600; }
.chips.pick .chip { padding: 10px 14px; font-size: 15px; border: 1px solid transparent; }
.chips.pick .chip.on { background: color-mix(in srgb, var(--accent) 22%, var(--bg2)); border-color: var(--accent); }
.agree { display: flex; gap: 10px; align-items: flex-start; margin-top: 20px; font-size: 15px; }
.agree input { width: 22px; height: 22px; flex: none; margin-top: 2px; }
.agree a { color: var(--accent); }
/* фото */
.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mslot { position: relative; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; background: var(--bg2); display: grid; place-items: center; text-align: center; }
.mslot img, .mslot video { width: 100%; height: 100%; object-fit: cover; }
.mslot.add { border: 2px dashed var(--line); cursor: pointer; color: var(--hint); }
.mslot.add span { font-size: 28px; display: block; }
.mslot.add small { font-size: 11.5px; padding: 0 4px; }
.mslot em { position: absolute; left: 6px; bottom: 6px; font-style: normal; font-size: 11px; background: var(--accent); color: var(--accent-text); padding: 2px 7px; border-radius: 8px; }
.mdel { position: absolute; top: 5px; right: 5px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; }
.mmain { position: absolute; left: 5px; right: 5px; bottom: 5px; font-size: 11px; background: rgba(0,0,0,.55); color: #fff; border-radius: 8px; padding: 3px; }
.sec { margin: 22px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--hint); }

/* взаємність */
.match { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
.match.on { display: flex; }
.match img { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; border: 4px solid var(--like); margin-bottom: 18px; }
.match .btn { max-width: 320px; }
.toast { position: fixed; left: 50%; bottom: calc(90px + var(--safe-bottom)); transform: translateX(-50%); background: rgba(0,0,0,.82); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 40; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
</style>
</head>
<body>
  <section class="view on" id="feed">
    <div class="stage" id="stage"><div class="empty"><div class="loader"></div></div></div>
    <div class="actions" id="actions" hidden>
      <button class="round" id="bNope" aria-label="Далі">👎</button>
      <button class="round like" id="bLike" aria-label="Лайк">❤️</button>
    </div>
  </section>
  <section class="view" id="likes"><div class="scroll" id="likesBox"></div></section>
  <section class="view" id="matches"><div class="scroll" id="matchesBox"></div></section>
  <section class="view" id="profile"><div class="scroll" id="profileBox"></div></section>

  <nav class="tabs" id="tabs" hidden>
    <button data-v="feed" class="on"><span>🔥</span>Анкети</button>
    <button data-v="likes"><span>❤️</span>Лайки<i class="dot" id="likesDot" hidden></i></button>
    <button data-v="matches"><span>💬</span>Симпатії</button>
    <button data-v="profile"><span>👤</span>Профіль</button>
  </nav>

  <div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
  <div class="match" id="match"></div>

<script>
(() => {
  const tg = window.Telegram?.WebApp;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const hap = (t = "light") => { try { tg?.HapticFeedback?.impactOccurred(t); } catch {} };
  const ok = t => { try { tg?.HapticFeedback?.notificationOccurred(t); } catch {} };
  function toast(m) { document.querySelectorAll(".toast").forEach(t => t.remove()); const d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
  async function api(path, body) {
    const r = await fetch("/app/api/" + path, { method: body ? "POST" : "GET", headers: { "content-type": "application/json", "x-init-data": tg?.initData || "" }, body: body ? JSON.stringify(body) : undefined });
    let d = {}; try { d = await r.json(); } catch {}
    if (!r.ok) throw new Error(d.error || "Помилка " + r.status);
    return d;
  }
  try { tg.ready(); tg.expand(); tg.disableVerticalSwipes?.(); tg.setHeaderColor?.("bg_color"); tg.setBackgroundColor?.("bg_color"); } catch {}

  let ME = null, card = null, nextCard = null, idx = 0, busy = false;
  const plural = n => n % 10 === 1 && n % 100 !== 11 ? "людині" : "людям";

  async function boot() {
    if (!tg?.initData) {
      // відкрито не так, як треба (напр. зі старої кнопки під полем вводу або в браузері)
      $("stage").innerHTML = `<div class="empty"><div><b>Відкрий застосунок ще раз</b>Натисни кнопку <b>«❤️ Знайомства»</b> зліва від поля вводу в чаті з ботом${tg?.platform && tg.platform !== "unknown" ? "" : " у Telegram"}.<br><br>${tg?.close ? `<button class="btn primary" id="cl">Закрити</button>` : ""}</div></div>`;
      if ($("cl")) $("cl").onclick = () => tg.close();
      return;
    }
    try { ME = await api("me"); } catch (e) { $("stage").innerHTML = `<div class="empty"><div><b>Не вдалося відкрити</b>${esc(e.message)}</div></div>`; return; }
    if (!ME.registered) return wizard();
    $("tabs").hidden = false;
    setDot(ME.likes);
    const start = (location.hash || "").slice(1);
    if (start === "support") { go("profile"); openSupport(); }
    else if (["likes", "matches", "profile"].includes(start)) go(start); else loadNext();
  }
  function setDot(n) { $("likesDot").hidden = !n; $("likesDot").textContent = n > 99 ? "99+" : n; }

  // ---------- преміум: оплата зірками Telegram прямо в застосунку ----------
  const isPrem = () => (ME?.me?.premiumUntil || 0) * 1000 > Date.now();
  const untilText = t => { const d = new Date(t * 1000); return t * 1000 - Date.now() > 864e5 ? "до " + d.toLocaleDateString("uk", { day: "numeric", month: "long" }) : "сьогодні до " + d.toLocaleTimeString("uk", { hour: "2-digit", minute: "2-digit" }); };
  function plansHtml() {
    const ps = ME.plans || [];
    if (!ps.length) return "";
    const perDay = p => p.stars / p.days, best = ps.length > 1 ? ps.reduce((a, b) => perDay(b) < perDay(a) ? b : a) : null;
    const euroDay = p => { const v = p.stars * (ME.starEur || 0.02) / p.days; return (v < 1 ? v.toFixed(2) : v.toFixed(1)).replace(".", ",") + " €"; };
    return `<div class="plans">${ps.map(p => `<button class="plan ${p === best ? "best" : ""}" data-plan="${p.i}">${p === best ? "<em>Вигідно</em>" : ""}<span class="pt">${esc(p.name || p.title)}</span><b>≈${esc(p.eur)}</b><small>⭐ ${p.stars}</small><small style="white-space:nowrap">${euroDay(p)}/день</small></button>`).join("")}</div>
      <p class="muted" style="font-size:12px;margin:4px 2px 0">Оплата зірками Telegram ⭐. Ціна в євро приблизна — залежить від країни й телефону.</p>
      <button class="linkish" data-terms>Умови оплати</button>`;
  }
  function bindPlans(root, after) {
    root.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => buyPremium(+b.dataset.plan, b, after));
    root.querySelectorAll("[data-terms]").forEach(b => b.onclick = showTerms);
  }
  function showTerms() {
    sheet(`<h2>💎 Умови Преміуму</h2>${(ME.plans || []).map(p => `<p style="margin:6px 0"><b>${esc(p.name || p.title)} — ≈${esc(p.eur)}</b> <span class="muted">(${p.stars} ⭐, ${p.days} дн.)</span></p>`).join("")}
      <p class="muted">Оплата йде зірками Telegram. Ціна в євро приблизна: зірки купуються в Telegram, і їхня ціна трохи залежить від країни й способу купівлі.</p>
      <p class="muted">Разова оплата зірками Telegram, без автосписань. Дні додаються до поточного строку. Оплачений Преміум зберігається, навіть якщо видалити анкету й створити нову.</p>
      <p class="muted">Не активувався або щось пішло не так — напиши в підтримку, ми нарахуємо дні або повернемо зірки.</p>
      <button class="btn primary" id="tSup">💬 Написати в підтримку</button>`);
    $("tSup").onclick = () => openSupport("Питання щодо оплати Преміуму: ");
  }
  // ---------- підтримка ----------
  let supTimer = null;
  async function openSupport(prefill = "") {
    sheet(`<h2>💬 Підтримка</h2><p class="muted" style="margin:0 0 8px">Напиши, що сталося, — адміністратор відповість тут і в чаті з ботом.</p>
      <div class="sup-log" id="supLog"><div class="empty"><div class="loader"></div></div></div>
      <textarea id="supText" maxlength="2000" placeholder="Твоє повідомлення…" style="min-height:80px"></textarea>
      <button class="btn primary" id="supSend">Надіслати</button>`);
    $("supText").value = prefill;
    const draw = msgs => {
      const log = $("supLog"); if (!log) return;
      log.innerHTML = msgs.length ? msgs.map(m => `<div class="bub ${m.from === "admin" ? "adm" : "me"}">${m.from === "admin" ? "<b>Підтримка</b>" : ""}${esc(m.text)}<small>${new Date(m.ts).toLocaleString("uk", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</small></div>`).join("")
        : `<p class="muted" style="text-align:center;margin:10px 0">Тут буде ваша переписка з підтримкою.</p>`;
      log.scrollTop = log.scrollHeight;
    };
    const load = async () => { try { draw((await api("support")).messages); if (ME) ME.supportUnread = 0; const b = document.querySelector("#support .badge-n"); b && b.remove(); } catch (e) { $("supLog") && ($("supLog").innerHTML = `<p class="muted">${esc(e.message)}</p>`); } };
    await load();
    clearInterval(supTimer);
    supTimer = setInterval(() => { if (!$("supLog") || !$("sheetBg").classList.contains("on")) return clearInterval(supTimer); load(); }, 15000);
    $("supSend").onclick = async () => {
      const text = $("supText").value.trim();
      if (text.length < 2) return toast("Напиши повідомлення");
      $("supSend").disabled = true;
      try { draw((await api("support", { text })).messages); $("supText").value = ""; ok("success"); toast("✅ Надіслано. Відповідь прийде сюди й у чат з ботом."); }
      catch (e) { toast(e.message); }
      $("supSend").disabled = false;
    };
  }

  async function buyPremium(i, btn, after) {
    let link;
    btn && (btn.disabled = true);
    try { link = (await api("invoice", { plan: i })).link; } catch (e) { toast(e.message); btn && (btn.disabled = false); return; }
    const before = ME.me.premiumUntil || 0;
    if (!tg?.openInvoice) { btn && (btn.disabled = false); tg?.openTelegramLink ? tg.openTelegramLink(link) : (location.href = link); return; }  // старий Telegram
    tg.openInvoice(link, async status => {
      btn && (btn.disabled = false);
      if (status === "paid") {
        ok("success"); toast("💎 Оплату отримано! Активуємо Преміум…");
        // бот зараховує платіж за секунду-дві — чекаємо, поки строк оновиться
        for (let k = 0; k < 15; k++) {
          try { const r = await api("premium"); if (r.premiumUntil > before && r.premiumUntil * 1000 > Date.now()) { ME.me.premiumUntil = r.premiumUntil; break; } } catch {}
          await new Promise(r => setTimeout(r, 1000));
        }
        toast(isPrem() ? `💎 Преміум ${untilText(ME.me.premiumUntil)}` : "Оплата пройшла — Преміум з'явиться за хвилину");
        after && after();
      } else if (status === "failed") { ok("error"); toast("Оплата не пройшла. Спробуй ще раз."); }
    });
  }

  // ---------- таби ----------
  let view = "feed";
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.v));
  function go(v) {
    view = v; hap("soft");

  // ---------- стрічка ----------
  async function fetchNext() { const r = await api("next"); return r.empty ? null : r.card; }
  async function loadNext() {
    $("actions").hidden = true;
    if (nextCard) { card = nextCard; nextCard = null; }
    else {
      $("stage").innerHTML = `<div class="empty"><div class="loader"></div></div>`;
      try { card = await fetchNext(); } catch (e) { $("stage").innerHTML = `<div class="empty"><div><b>Помилка</b>${esc(e.message)}</div></div>`; return; }
    }
    if (!card) {
      $("stage").innerHTML = `<div class="empty"><div><b>Нових анкет поки немає</b>Зазирни пізніше — нові люди реєструються щодня.<br><br><button class="btn" id="toFilters">⚙️ Змінити фільтри</button><button class="btn" id="retry">🔄 Ще раз</button></div></div>`;
      $("toFilters").onclick = () => go("profile"); $("retry").onclick = loadNext;

    }
    idx = 0; renderCard();
    // наступну анкету готуємо заздалегідь (якщо поточна не вхідний лайк — інакше сервер віддасть її ж)
    if (!card.incoming) fetchNext().then(c => { nextCard = c; if (c?.media[0]) { const i = new Image(); i.src = c.media[0].url; } }).catch(() => {});
  }
  function mediaEl(m) { return m.t === "video" ? `<video src="${m.url}" autoplay muted loop playsinline></video>` : `<img src="${m.url}" alt="">`; }
  function renderCard() {
    const c = card, n = c.media.length;
    $("stage").innerHTML = `<div class="card" id="card">${n > 1 ? `<div class="bars">${c.media.map((_, i) => `<i class="${i <= idx ? "on" : ""}"></i>`).join("")}</div>` : ""}
      ${c.incoming ? `<div class="badge-in" title="Ти сподобався(-лась)">❤️</div>` : ""}
      <button class="info-btn" id="info" aria-label="Про людину">ⓘ</button>
      ${mediaEl(c.media[idx] || c.media[0])}</div>`;
    $("actions").hidden = false;
    $("info").onclick = e => { e.stopPropagation(); openInfo(); };
    drag($("card"));
  }
  function drag(el) {
    let x0 = 0, y0 = 0, dx = 0, dy = 0, down = false, moved = false;
    el.onpointerdown = e => { if (e.target.closest(".info-btn")) return; down = true; moved = false; x0 = e.clientX; y0 = e.clientY; dx = dy = 0; el.setPointerCapture(e.pointerId); };
    el.onpointermove = e => {
      if (!down) return;
      dx = e.clientX - x0; dy = e.clientY - y0;
      if (Math.abs(dx) > 6) moved = true;
      el.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;  // картка йде за пальцем, без анімацій і написів
    };
    el.onpointerup = el.onpointercancel = e => {
      if (!down) return; down = false;
      if (dx > 90) return act("like");
      if (dx < -90) return act("skip");
      el.style.transform = "";
      if (!moved && card.media.length > 1) {   // тап: ліва/права частина — попереднє/наступне фото
        const r = el.getBoundingClientRect();
        idx = (e.clientX - r.left < r.width / 2) ? Math.max(0, idx - 1) : Math.min(card.media.length - 1, idx + 1);
        renderCard(); hap("soft");
      }
    };
  }
  $("bLike").onclick = () => act("like");
  $("bNope").onclick = () => act("skip");
  async function act(action) {
    if (busy || !card) return;

    try {
      const r = await api("swipe", { id: c.id, action, incoming: c.incoming });

  }

        `<div class="two"><button class="btn" id="lN">👎</button><button class="btn primary" id="lY">❤️ Взаємно</button></div>`);
      const done = async action => { try { const x = await api("swipe", { id: c.id, action, incoming: true }); closeSheet(); b.remove(); ME.likes = Math.max(0, ME.likes - 1); setDot(ME.likes); if (x.match) showMatch(x.match); } catch (e) { toast(e.message); } };

  // ---------- спільне: фото, локація, правила ----------
  const H = { "x-init-data": tg?.initData || "" };
  const richText = s => esc(s).replace(/&lt;(\/?)(b|i)&gt;/g, "<$1$2>").replace(/\n/g, "<br>");
  async function compress(file) {
    if (!file.type.startsWith("image/")) return file;
    try {
      const img = await createImageBitmap(file);
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      return await new Promise(r => cv.toBlob(b => r(b || file), "image/jpeg", 0.86));
    } catch { return file; }
  }
  // якщо застосунок відкрили за посиланням без «Почати» — просимо дозволу боту писати (потрібно для фото й сповіщень про симпатії)
  let writeOk = !!tg?.initDataUnsafe?.user?.allows_write_to_pm;
  function askWrite() {
    if (writeOk || !tg?.requestWriteAccess) return Promise.resolve(true);
    return new Promise(res => tg.requestWriteAccess(g => { writeOk = !!g; res(writeOk); }));
  }
  async function uploadFile(file) {
    if (!(await askWrite())) throw new Error("Дозволь боту писати тобі — так ми збережемо фото й повідомимо про симпатії");
    if (file.type.startsWith("video/") && file.size > 20 * 1024 * 1024) throw new Error("Відео завелике (до 20 МБ, до 60 с)");
    const fd = new FormData(); fd.append("file", await compress(file), file.name || "photo.jpg");
    const r = await fetch("/app/api/upload", { method: "POST", headers: H, body: fd });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Не вдалося завантажити");
    return d;
  }
  function getLocation() {
    return new Promise((res, rej) => {
      const lm = tg?.LocationManager;
      const viaBrowser = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lon: p.coords.longitude }), () => rej(new Error("Не вдалося отримати локацію")), { timeout: 15000 }) : rej(new Error("Локація недоступна"));
      if (lm && lm.init) {
        lm.init(() => {
          if (!lm.isLocationAvailable) return viaBrowser();
          lm.getLocation(d => d ? res({ lat: d.latitude, lon: d.longitude }) : (lm.isAccessRequested && !lm.isAccessGranted ? rej(new Error("Дозволь доступ до локації в налаштуваннях бота")) : viaBrowser()));
        });
      } else viaBrowser();
    });
  }
  function showRules() { sheet(`<h2>📜 Правила</h2><div class="about">${richText(ME.rules)}</div><div class="about muted">${richText(ME.disclaimer)}</div><button class="btn" onclick="this.closest('.sheet-bg')?.classList.remove('on')">Зрозуміло</button>`); }

  // редактор фото/відео: до 3, перше — головне
  function mediaEditor(box, items, onChange) {
    const draw = () => {
      box.innerHTML = `<div class="mgrid">${[0, 1, 2].map(i => {
        const m = items[i];
        if (!m) return `<label class="mslot add">${items.uploading === i ? `<div class="loader"></div>` : `<span>＋</span><small>${i === 0 ? "Головне фото" : "Фото або відео"}</small>`}<input type="file" accept="image/*,video/*" ${i === items.length ? "" : "disabled"} hidden data-add></label>`;
        return `<div class="mslot" data-i="${i}">${m.t === "video" ? `<video src="${m.url}" muted playsinline loop autoplay></video>` : `<img src="${m.url}" alt="">`}
          ${i === 0 ? `<em>Головне</em>` : `<button class="mmain" data-main="${i}">Зробити головним</button>`}<button class="mdel" data-del="${i}" aria-label="Видалити">✕</button></div>`;
      }).join("")}</div><p class="muted" style="font-size:13px;margin:6px 2px 0">До 3 фото або відео до 60 с. Вертикальні фото виглядають найкраще.</p>`;
      box.querySelectorAll("[data-add]").forEach(inp => inp.onchange = async () => {
        const files = [...inp.files].slice(0, 3 - items.length);
        for (const f of files) {
          items.uploading = items.length; draw();
          try { items.push(await uploadFile(f)); hap(); } catch (e) { toast(e.message); }
          items.uploading = null; draw();
        }
        onChange && onChange(items);
      });
      box.querySelectorAll("[data-del]").forEach(b => b.onclick = e => { e.stopPropagation(); if (items.length === 1 && onChange?.needOne) return toast("Потрібне хоча б одне фото"); items.splice(+b.dataset.del, 1); draw(); onChange && onChange(items); });
      box.querySelectorAll("[data-main]").forEach(b => b.onclick = e => { e.stopPropagation(); const [m] = items.splice(+b.dataset.main, 1); items.unshift(m); draw(); onChange && onChange(items); hap("soft"); });
    };
    draw();
  }

  // ---------- реєстрація в застосунку ----------

      { t: "Твої фото", h: () => `<div id="wMedia"></div>`, after: () => mediaEditor($("wMedia"), R.media), ok: () => R.media.length > 0 || "Додай хоча б одне фото" },
      { t: "Розкажи про себе", h: () => `<textarea id="wAbout" maxlength="700" placeholder="Хто ти, кого хочеш знайти, чим пропонуєш зайнятися">${esc(R.about)}</textarea><div class="lbl">Звідки ти родом в Україні? <span class="muted">(необов'язково)</span></div>${chips(ME.hometowns.map(c => [c, c]), R.hometown, "hometown")}<input id="wHome" maxlength="40" value="${esc(ME.hometowns.includes(R.hometown) ? "" : R.hometown)}" placeholder="Інше місто">`,
        ok: () => { const h = $("wHome").value.trim(); if (h) R.hometown = h; R.about = $("wAbout").value.trim(); return R.about.length >= 3 || "Напиши кілька слів про себе"; } },
      { t: "Майже готово!", h: () => `<button class="btn" id="wLoc">${R.lat != null ? "✅ Локацію додано" : "📍 Показувати людей поруч"}</button><p class="muted">Інші бачать лише приблизну відстань у км, не адресу. Можна пропустити.</p>
          <label class="agree"><input type="checkbox" id="wAgree" ${R.agree ? "checked" : ""}> <span>Мені є 18 років, я погоджуюсь з <a href="#" id="wRules">правилами</a> і буду використовувати лише свої фото.</span></label>`,
        after: () => { $("wLoc").onclick = async () => { try { const l = await getLocation(); R.lat = l.lat; R.lon = l.lon; $("wLoc").textContent = "✅ Локацію додано"; ok("success"); } catch (e) { toast(e.message); } }; $("wRules").onclick = e => { e.preventDefault(); showRules(); }; },
        ok: () => (R.agree = $("wAgree").checked) || "Постав галочку, щоб продовжити" },
    ];
    const draw = () => {
      const s = steps[step];
      $("stage").innerHTML = `<div class="wiz"><div class="wbar"><i style="width:${(step + 1) / steps.length * 100}%"></i></div>
        ${step ? `<button class="wback" id="wBack">‹ Назад</button>` : ""}
        <h2>${s.t}</h2><div class="wbody">${s.h()}</div>
        <button class="btn primary" id="wNext">${step === steps.length - 1 ? "Створити анкету ❤️" : "Далі"}</button></div>`;
      $("stage").querySelectorAll("[data-k]").forEach(b => b.onclick = () => { R[b.dataset.k] = b.dataset.v; if (b.dataset.k === "hometown" && $("wHome")) $("wHome").value = ""; if ($("wCity")) R.city = $("wCity").value; if ($("wAbout")) R.about = $("wAbout").value; draw(); hap("soft"); });
      s.after && s.after();
      if (step) $("wBack").onclick = () => { step--; draw(); };
      $("wNext").onclick = async () => {
        const v = s.ok(); if (v !== true) return toast(v);
        if (step < steps.length - 1) { step++; return draw(); }
        $("wNext").disabled = true;
        try {
          await api("register", { ...R, media: R.media.map(m => ({ t: m.t, id: m.id, tok: m.tok, thumb: m.thumb })) });
          ok("success"); ME = await api("me"); $("tabs").hidden = false; setDot(ME.likes);
          toast("🎉 Анкету створено!"); loadNext();
        } catch (e) { toast(e.message); $("wNext").disabled = false; }
      };
      const inp = $("stage").querySelector(".wbody input:not([type=checkbox]), .wbody textarea"); if (inp && step < 2) setTimeout(() => inp.focus(), 60);
    };
    $("actions").hidden = true;
    draw();
  }

  // ---------- профіль ----------
  function renderProfile() {
    const m = ME.me, f = ME.filters, box = $("profileBox");
    const free = m.freeUntil * 1000 > Date.now();
    const prem = m.premiumUntil * 1000 > Date.now();
    const opt = (v, cur, label) => `<option value="${esc(v)}" ${String(cur ?? "") === String(v) ? "selected" : ""}>${esc(label ?? v)}</option>`;
    const share = `https://t.me/share/url?url=${encodeURIComponent(ME.ref)}&text=${encodeURIComponent("Знайомства для українців за кордоном ❤️ Спробуй — тут багато наших поруч!")}`;
    box.innerHTML = `
      <div id="pMedia"></div>
      <div class="sec">💎 Преміум</div>
      ${prem ? `<div class="prem-on">💎 <b>Преміум активний</b> — ${untilText(m.premiumUntil)}<br><span class="muted">Бачиш усіх, хто тебе лайкнув. Можна продовжити — дні додадуться.</span></div>`
             : `<p style="margin:4px 2px">Побач усіх, кому ти сподобався(-лась), і відповідай взаємністю. Оплата зірками Telegram ⭐ — не виходячи з застосунку.</p>`}
      <div id="pPlans">${plansHtml() || `<p class="muted" style="margin:4px 2px">Оплата тимчасово недоступна — запроси друга, щоб отримати Преміум.</p>`}</div>
      <div class="sec">Анкета</div>
      <div class="two"><div class="field"><label>Ім'я</label><input id="pName" maxlength="30" value="${esc(m.name)}"></div><div class="field"><label>Вік</label><input id="pAge" type="number" inputmode="numeric" min="18" max="70" value="${esc(m.age)}"></div></div>
      <div class="two"><div class="field"><label>Країна</label><select id="pCountry">${ME.countries.map(c => opt(c, m.country)).join("")}</select></div><div class="field"><label>Місто</label><input id="pCity" maxlength="40" value="${esc(m.city)}" placeholder="Аліканте"></div></div>
      <div class="two"><div class="field"><label>Я</label><select id="pGender">${opt("m", m.gender, "Хлопець")}${opt("f", m.gender, "Дівчина")}</select></div><div class="field"><label>Шукаю</label><select id="pSearch">${opt("f", m.search, "Дівчину")}${opt("m", m.search, "Хлопця")}</select></div></div>
      <div class="field"><label>Звідки родом в Україні</label><input id="pHome" maxlength="40" value="${esc(m.hometown)}" placeholder="Львів"></div>
      <div class="field"><label>Про себе</label><textarea id="pAbout" maxlength="700">${esc(m.about)}</textarea></div>
      <button class="btn primary" id="save">Зберегти</button>
      <button class="btn" id="loc">${m.location ? "📍 Оновити локацію" : "📍 Додати локацію — люди поруч першими"}</button>
      <div class="sec">Статус</div>
      <div class="toggle"><div>☕️ Вільний(-а) сьогодні<small>24 години анкета вище, з позначкою «можна на каву»</small></div><button class="sw ${free ? "on" : ""}" id="tFree"></button></div>
      <div class="toggle"><div>⏸ Пауза<small>Тебе ніхто не бачить, поки пауза увімкнена</small></div><button class="sw ${m.paused ? "on" : ""}" id="tPause"></button></div>
      <div class="sec">Кого шукати</div>
      <div class="field"><label>Країна пошуку</label><select id="fCountry">${opt("", f.country, `Моя (${m.country})`)}${ME.countries.map(c => opt(c, f.country)).join("")}</select></div>
      <div class="two"><div class="field"><label>Вік від</label><input id="fMin" type="number" inputmode="numeric" min="18" max="70" value="${esc(f.min_age ?? "")}" placeholder="18"></div><div class="field"><label>до</label><input id="fMax" type="number" inputmode="numeric" min="18" max="70" value="${esc(f.max_age ?? "")}" placeholder="70"></div></div>
      <button class="btn" id="saveF">Застосувати фільтри</button>
      <div class="sec">Запроси друзів</div>
      <p style="margin:4px 2px">🎁 Коли друг створить анкету за твоїм посиланням, ви <b>обоє</b> отримаєте ${ME.premiumMinutes} хв Преміуму — побачите, хто вас лайкнув.</p>
      <p class="muted" style="margin:4px 2px">Ти вже запросив(-ла): <b>${ME.invited}</b></p>
      <div class="two"><button class="btn primary" id="share">📤 Надіслати другу</button><button class="btn" id="copy">🔗 Копіювати</button></div>
      <div class="sec">Ще</div>
      <button class="btn" id="support">💬 Підтримка${ME.supportUnread ? `<span class="badge-n">${ME.supportUnread}</span>` : ""}</button>
      <button class="btn" id="rules">📜 Правила і безпека</button>
      <button class="btn danger" id="del">🗑 Видалити анкету</button>`;
    const media = (m.mediaRaw || []).map(x => ({ ...x }));
    const onMedia = async items => {
      try { const r = await api("media", { media: items.map(x => ({ t: x.t, id: x.id, tok: x.tok, thumb: x.thumb })) }); m.mediaRaw = r.media; ok("success"); toast("✅ Фото збережено"); }
      catch (e) { toast(e.message); }
    };
    onMedia.needOne = true;
    mediaEditor($("pMedia"), media, onMedia);
    bindPlans($("pPlans"), () => view === "profile" && renderProfile());
    $("save").onclick = async () => {
      const body = { name: $("pName").value, age: $("pAge").value, country: $("pCountry").value, city: $("pCity").value, gender: $("pGender").value, search: $("pSearch").value, hometown: $("pHome").value, about: $("pAbout").value };
      try { await api("profile", body); Object.assign(ME.me, { ...body, age: +body.age }); nextCard = null; ok("success"); toast("✅ Збережено"); } catch (e) { toast(e.message); }
    };
    $("loc").onclick = async () => { try { const l = await getLocation(); await api("profile", l); m.location = true; $("loc").textContent = "📍 Оновити локацію"; ok("success"); toast("📍 Локацію оновлено"); } catch (e) { toast(e.message); } };
    $("tFree").onclick = async e => { const on = !e.target.classList.contains("on"); try { await api("profile", { free: on }); e.target.classList.toggle("on", on); ME.me.freeUntil = on ? Date.now() / 1000 + 86400 : 0; hap(); } catch (x) { toast(x.message); } };
    $("tPause").onclick = async e => { const on = !e.target.classList.contains("on"); try { await api("profile", { paused: on }); e.target.classList.toggle("on", on); ME.me.paused = on; hap(); toast(on ? "⏸ Анкету приховано" : "▶️ Анкета знову в пошуку"); } catch (x) { toast(x.message); } };
    $("saveF").onclick = async () => {
      const filters = { country: $("fCountry").value || null, min_age: $("fMin").value, max_age: $("fMax").value };
      try { await api("profile", { filters }); ME.filters = { country: filters.country, min_age: +filters.min_age || null, max_age: +filters.max_age || null }; nextCard = null; card = null; ok("success"); toast("Фільтри застосовано"); go("feed"); } catch (e) { toast(e.message); }
    };
    $("share").onclick = () => tg.openTelegramLink(share);
    $("copy").onclick = async () => { try { await navigator.clipboard.writeText(ME.ref); toast("🔗 Посилання скопійовано"); } catch { sheet(`<h2>Твоє посилання</h2><input value="${esc(ME.ref)}" readonly onclick="this.select()">`); } };
    $("rules").onclick = showRules;
    $("support").onclick = () => openSupport();
    $("del").onclick = () => {
      sheet(`<h2>Видалити анкету?</h2><p class="muted">Фото, лайки й симпатії буде стерто назавжди. Якщо хочеш перепочити — краще увімкни «⏸ Паузу».</p>
        <button class="btn" id="dPause">⏸ Краще пауза</button><button class="btn danger" id="dYes">🗑 Так, видалити назавжди</button>`);
      $("dPause").onclick = async () => { await api("profile", { paused: true }); ME.me.paused = true; closeSheet(); renderProfile(); toast("⏸ Анкету приховано"); };
      $("dYes").onclick = async () => { try { await api("delete", { confirm: "DELETE" }); closeSheet(); toast("Анкету видалено"); ME = await api("me"); $("tabs").hidden = true; card = nextCard = null; document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "feed")); wizard(); } catch (e) { toast(e.message); } };
    };
  }

  boot();
})();
</script>
</body>
</html>
