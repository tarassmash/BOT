<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FlirtUA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* FlirtUA — «Наші поруч». Нічний кобальт, пшеничне золото, червоний вишивки. Один яскравий елемент — вишиванка. */
:root {
  --night: #0E1E45;      /* фон */
  --deep: #172B5C;       /* поверхні */
  --deep2: #20376E;      /* піднята поверхня, поля */
  --gold: #F3C443;       /* головні дії */
  --gold-ink: #1A2340;   /* текст на золотому */
  --red: #E2394B;        /* лайк, серця, вишивка */
  --sky: #8DB4FF;        /* посилання, другорядне */
  --linen: #F5EEE2;      /* текст */
  --hint: #A7B3CF;       /* другорядний текст */
  --line: rgba(245, 238, 226, .12);
  --ok: #5FD39A;
  --bg: var(--night); --bg2: var(--deep); --text: var(--linen); --accent: var(--gold); --accent-text: var(--gold-ink); --like: var(--red);
  --display: "Unbounded", "Onest", system-ui, sans-serif;
  --body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  --safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));
  --vh: var(--tg-viewport-stable-height, 100dvh);
  --stitch: none;        /* орнамент — малюється скриптом */
  --glow: #1B3375;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--linen); font: 16px/1.45 var(--body); overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; height: var(--vh); padding-top: var(--safe-top); overflow: hidden; user-select: none; -webkit-user-select: none;
  background: radial-gradient(120% 60% at 50% -10%, var(--glow) 0%, var(--night) 60%) var(--night); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
input, textarea, select { font: inherit; color: var(--linen); background: var(--deep2); border: 1px solid transparent; border-radius: 14px; padding: 12px 14px; width: 100%; user-select: text; -webkit-user-select: text; }
input::placeholder, textarea::placeholder { color: #8391B3; }
input:focus, textarea:focus, select:focus { border-color: var(--gold); outline: none; }
textarea { resize: none; min-height: 100px; }
h2 { font: 700 22px/1.2 var(--display); margin: 0 0 6px; letter-spacing: -.01em; }
.muted { color: var(--hint); }
.view { flex: 1; min-height: 0; display: none; flex-direction: column; }
.view.on { display: flex; }
.scroll { flex: 1; overflow-y: auto; padding: 16px 16px 24px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.x-close { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--linen) 10%, transparent); color: var(--linen); }
.x-close svg { width: 18px; height: 18px; }
.x-close:active { transform: scale(.92); }

/* вишиванка: смуга хрестикового орнаменту */
.orn { height: 14px; background: var(--stitch) repeat-x center / auto 14px; flex: none; }
.orn.big { height: 28px; background-size: auto 28px; }

/* шапка стрічки */
.top { display: flex; align-items: center; gap: 10px; padding: 6px 14px 8px; flex: none; }
.brand { font: 800 20px/1 var(--display); letter-spacing: -.02em; display: flex; align-items: center; gap: 7px; }
.brand i { width: 22px; height: 22px; display: inline-block; background: var(--stitch-heart) center / contain no-repeat; }
.brand b { color: var(--gold); font-weight: 800; }
.here { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(243, 196, 67, .12); color: var(--gold); font-weight: 600; font-size: 14px; max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* стрічка */
#feed { padding: 0 10px; }
.stage { flex: 1; min-height: 0; position: relative; }
.card { position: absolute; inset: 0; border-radius: 24px; overflow: hidden; background: var(--deep); touch-action: none; will-change: transform; box-shadow: 0 18px 40px rgba(3, 10, 30, .55); }
.card img, .card video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.card .shade { position: absolute; inset: auto 0 0 0; height: 58%; background: linear-gradient(180deg, transparent 0%, color-mix(in srgb, var(--night) 55%, transparent) 40%, color-mix(in srgb, var(--night) 95%, #000) 100%); pointer-events: none; }
.card .who { position: absolute; left: 18px; right: 64px; bottom: 18px; pointer-events: none; }
.who h3 { margin: 0; font: 700 30px/1.05 var(--display); letter-spacing: -.02em; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.35); }
.who h3 span { font-weight: 500; opacity: .9; }
.route { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 15px; font-weight: 600; color: #fff; }
.route .arr { color: var(--gold); }
.route .km { color: var(--hint); font-weight: 500; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: rgba(245, 238, 226, .14); color: #fff; backdrop-filter: blur(6px); }
.tag.home { background: var(--gold); color: var(--gold-ink); }
.tag.coffee { background: rgba(95, 211, 154, .2); color: #BFF3D9; }
.tag.in { background: var(--red); }
.bars { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; gap: 4px; z-index: 2; }
.bars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .35); }
.bars i.on { background: #fff; }
.info-btn { position: absolute; bottom: 22px; right: 16px; z-index: 3; width: 40px; height: 40px; border-radius: 50%; background: rgba(245, 238, 226, .16); color: #fff; display: grid; place-items: center; backdrop-filter: blur(6px); }
.info-btn svg { width: 20px; height: 20px; }
.badge-in { display: none; }
.actions { display: flex; justify-content: center; align-items: center; gap: 22px; padding: 14px 0 calc(10px + var(--safe-bottom)); }
.round { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--deep); border: 1.5px solid var(--line); transition: transform .12s; }
.round svg { width: 28px; height: 28px; }
.round:active { transform: scale(.92); }
.round.like { width: 74px; height: 74px; background: var(--red); border-color: transparent; box-shadow: 0 10px 26px rgba(226, 57, 75, .45); }
.round.like svg { width: 34px; height: 34px; }
.round.super { width: 52px; height: 52px; color: var(--gold); border-color: rgba(243, 196, 67, .45); }
.round.super svg { width: 24px; height: 24px; }
.round.nope { color: var(--hint); }
.stage > .empty { position: absolute; inset: 0; }
.scroll > .empty { min-height: 100%; }
.empty { flex: 1; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--hint); }
.empty b { display: block; color: var(--linen); font: 700 19px/1.25 var(--display); margin-bottom: 8px; }
.empty .btn { display: inline-block; width: auto; padding: 11px 18px; margin: 12px 4px 0; }
.loader { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--gold); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* таби */
.tabs { display: flex; background: color-mix(in srgb, var(--night) 92%, transparent); border-top: 1px solid var(--line); padding: 4px 0 var(--safe-bottom); backdrop-filter: blur(10px); }
.tabs button { flex: 1; padding: 7px 0 6px; display: grid; justify-items: center; gap: 2px; color: var(--hint); font-size: 11.5px; font-weight: 600; position: relative; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button.on { color: var(--gold); }
.tabs .dot { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font: 700 11px/18px var(--body); font-style: normal; }

/* аркуші */
.sheet-bg { position: fixed; inset: 0; background: rgba(4, 10, 28, .6); z-index: 20; display: none; }
.sheet-bg.on { display: block; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; overscroll-behavior: contain; background: var(--deep); border-radius: 26px 26px 0 0; padding: 10px 18px calc(18px + var(--safe-bottom)); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chip { background: var(--deep2); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.about { white-space: pre-wrap; word-break: break-word; margin: 10px 0 14px; line-height: 1.55; }
.note { background: rgba(226, 57, 75, .14); border-radius: 14px; padding: 11px 13px; margin: 8px 0; }
.btn { display: block; width: 100%; padding: 14px; border-radius: 16px; background: var(--deep2); font-weight: 700; text-align: center; margin-top: 8px; }
.btn:active { transform: scale(.99); }
.btn.primary { background: var(--gold); color: var(--gold-ink); }
.btn.danger { color: #FF8A95; background: transparent; border: 1px solid rgba(255, 138, 149, .3); }
.btn:disabled { opacity: .55; }
.list-btn { display: block; width: 100%; text-align: left; padding: 14px 4px; border-bottom: 1px solid var(--line); }

/* лайки, симпатії */
.head { margin: 4px 2px 14px; }
.head p { margin: 2px 0 0; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cell { border-radius: 18px; overflow: hidden; background: var(--deep); text-align: left; position: relative; }
.cell .ph { aspect-ratio: 3/4; background: var(--deep2); }
.cell .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cell .t { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 10px 9px; font-size: 14px; background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--night) 92%, #000)); }
.cell .t b { font-family: var(--display); font-weight: 700; font-size: 14px; }
.cell.locked .ph img { filter: blur(14px) saturate(.7); transform: scale(1.1); }
.big { font: 800 64px/1 var(--display); margin: 20px 0 6px; color: var(--gold); }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--deep2); border: 2px solid var(--gold); }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-family: var(--display); font-weight: 700; font-size: 15px; }
.pill { padding: 9px 15px; border-radius: 999px; background: var(--gold); color: var(--gold-ink); font-weight: 700; font-size: 14px; white-space: nowrap; }

/* профіль */
.me-head { display: flex; align-items: center; gap: 14px; margin: 2px 2px 14px; }
.me-head img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); background: var(--deep2); }
.me-head b { display: block; font: 700 20px/1.15 var(--display); }
.field { margin: 12px 0; }
.field label { display: block; font-size: 13px; color: var(--hint); margin: 0 0 6px 2px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); gap: 12px; }
.toggle small { display: block; color: var(--hint); }
.sw { width: 50px; height: 30px; border-radius: 15px; background: var(--deep2); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--linen); transition: left .15s; }
.sw.on { background: var(--gold); }
.sw.on::after { left: 23px; background: var(--gold-ink); }
.sec { margin: 26px 2px 8px; font: 700 15px/1.2 var(--display); color: var(--linen); }

/* привітання */
.hello { position: absolute; inset: 0; display: flex; flex-direction: column; overflow-y: auto; }
.hello .art { position: relative; flex: none; padding: 26px 22px 0; }
.hello h1 { font: 800 clamp(40px, 13vw, 56px)/.98 var(--display); letter-spacing: -.035em; margin: 22px 0 14px; }
.hello .lead { font-size: 17px; color: var(--hint); margin: 0; max-width: 32ch; }
.hello ul { list-style: none; margin: 26px 0 0; padding: 0 22px; display: grid; gap: 16px; }
.hello li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.hello li i { width: 44px; height: 44px; border-radius: 14px; background: var(--deep); display: grid; place-items: center; font-style: normal; font-size: 22px; }
.hello li b { display: block; font-weight: 700; }
.hello li span { color: var(--hint); font-size: 14.5px; }
.hello .go { margin-top: auto; padding: 22px 22px calc(16px + var(--safe-bottom)); }
.hello .go small { display: block; text-align: center; color: var(--hint); margin-top: 10px; font-size: 13px; }

/* реєстрація */
.wiz { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px 12px 20px; display: flex; flex-direction: column; }
.wiz h2 { margin: 20px 0 16px; font-size: 28px; line-height: 1.1; }
.wbody { flex: 1; }
.wbar { display: flex; gap: 4px; }
.wbar i { flex: 1; height: 4px; border-radius: 2px; background: var(--deep2); }
.wbar i.on { background: var(--gold); }
.wback { color: var(--hint); margin-top: 12px; align-self: flex-start; font-weight: 600; }
.lbl { margin: 18px 2px 6px; font-weight: 600; }
.chips.pick .chip { padding: 11px 15px; font-size: 15px; border: 1.5px solid transparent; }
.chips.pick .chip.on { background: rgba(243, 196, 67, .16); border-color: var(--gold); color: var(--gold); }
.agree { display: flex; gap: 10px; align-items: flex-start; margin-top: 20px; font-size: 15px; }
.agree input { width: 22px; height: 22px; flex: none; margin-top: 2px; accent-color: var(--gold); }
.agree a { color: var(--sky); }
/* фото */
.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mslot { position: relative; aspect-ratio: 3/4; border-radius: 16px; overflow: hidden; background: var(--deep); display: grid; place-items: center; text-align: center; }
.mslot img, .mslot video { width: 100%; height: 100%; object-fit: cover; }
.mslot.add { border: 1.5px dashed rgba(243, 196, 67, .45); cursor: pointer; color: var(--gold); }
.mslot.add span { font-size: 30px; display: block; line-height: 1; }
.mslot.add small { font-size: 11.5px; padding: 0 4px; color: var(--hint); }
.mslot em { position: absolute; left: 6px; bottom: 6px; font-style: normal; font-size: 11px; font-weight: 700; background: var(--gold); color: var(--gold-ink); padding: 2px 8px; border-radius: 8px; }
.mdel { position: absolute; top: 5px; right: 5px; width: 26px; height: 26px; border-radius: 50%; background: rgba(10, 21, 50, .7); color: #fff; font-size: 13px; }
.mmain { position: absolute; left: 5px; right: 5px; bottom: 5px; font-size: 11px; background: rgba(10, 21, 50, .7); color: #fff; border-radius: 8px; padding: 4px; }

/* преміум */
.prem { position: relative; border-radius: 22px; padding: 18px 16px 16px; background: linear-gradient(160deg, color-mix(in srgb, var(--deep) 70%, var(--glow) 60%) 0%, var(--deep) 70%); overflow: hidden; }
.prem::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px; background: var(--stitch) repeat-x center / auto 10px; opacity: .9; }
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; margin: 14px 0 4px; }
.plan { position: relative; border-radius: 18px; background: color-mix(in srgb, var(--night) 60%, transparent); border: 1.5px solid var(--line); padding: 16px 6px 12px; text-align: center; }
.plan:active { transform: scale(.97); }
.plan.best { border-color: var(--gold); background: rgba(243, 196, 67, .1); }
.plan b { display: block; font: 800 24px/1.1 var(--display); color: var(--linen); }
.plan.best b { color: var(--gold); }
.plan .pt { display: block; font-size: 14px; margin-bottom: 4px; font-weight: 600; }
.plan small { display: block; color: var(--hint); font-size: 11.5px; margin-top: 2px; }
.plan em { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 10.5px; font-weight: 700; background: var(--gold); color: var(--gold-ink); padding: 2px 9px; border-radius: 8px; white-space: nowrap; }
.plan[disabled] { opacity: .5; }
.prem-on { background: rgba(243, 196, 67, .12); border: 1px solid rgba(243, 196, 67, .35); border-radius: 16px; padding: 12px 14px; margin: 8px 0; }
.linkish { color: var(--sky); font-size: 13px; display: inline-block; margin-top: 8px; }

/* підтримка */
.sup-log { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto; padding: 4px 0 10px; }
.bub { max-width: 82%; padding: 10px 13px; border-radius: 18px; white-space: pre-wrap; word-break: break-word; font-size: 15px; user-select: text; -webkit-user-select: text; }
.bub small { display: block; font-size: 11px; opacity: .65; margin-top: 3px; }
.bub.me { align-self: flex-end; background: var(--gold); color: var(--gold-ink); border-bottom-right-radius: 6px; }
.bub.adm { align-self: flex-start; background: var(--deep2); border-bottom-left-radius: 6px; }
.bub.adm b { display: block; font-size: 12px; color: var(--gold); margin-bottom: 2px; }
.badge-n { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; background: var(--red); color: #fff; font: 700 12px/20px var(--body); }

/* взаємність */
.match { position: fixed; inset: 0; z-index: 30; background: var(--match-bg, none) center / cover no-repeat, radial-gradient(90% 60% at 50% 35%, color-mix(in srgb, var(--glow) 70%, #5A8BFF) 0%, var(--night) 70%); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
.match.on { display: flex; }
.match .orn { position: absolute; left: 0; right: 0; }
.match .orn.t { top: calc(var(--safe-top) + 14px); } .match .orn.b { bottom: calc(var(--safe-bottom) + 14px); }
.pair { display: flex; justify-content: center; margin-bottom: 22px; }
.pair img { width: 128px; height: 128px; border-radius: 50%; object-fit: cover; border: 4px solid var(--gold); background: var(--deep); }
.pair img + img { margin-left: -26px; border-color: var(--red); }
.match h2 { font-size: 34px; margin-bottom: 8px; }
.match .btn { max-width: 340px; }
@media (prefers-reduced-motion: no-preference) { .match.on .pair img { animation: meet .5s cubic-bezier(.2, .9, .3, 1.2) both; } .match.on .pair img + img { animation-delay: .08s; } }
@keyframes meet { from { transform: scale(.6); opacity: 0; } }
/* прапори: малюємо самі — емодзі-прапорців немає у Windows */
.flag { display: inline-block; width: 20px; height: 14px; border-radius: 3px; flex: none; vertical-align: -2px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.flag.ua { background: linear-gradient(#0057B7 50%, #FFD500 50%); }
.flag.es { background: linear-gradient(#AA151B 25%, #F1BF00 25% 75%, #AA151B 75%); }
.flag.pl { background: linear-gradient(#F5F5F5 50%, #DC143C 50%); }
.flag.de { background: linear-gradient(#111 33.3%, #DD0000 33.3% 66.6%, #FFCE00 66.6%); }
.flag.it { background: linear-gradient(90deg, #009246 33.3%, #F4F5F0 33.3% 66.6%, #CE2B37 66.6%); }
.flag.cz { background: linear-gradient(to bottom right, #11457E 50%, transparent 50.5%) top left / 50% 50% no-repeat, linear-gradient(to top right, #11457E 50%, transparent 50.5%) bottom left / 50% 50% no-repeat, linear-gradient(#F5F5F5 50%, #D7141A 50%); }
.flag.big { width: 34px; height: 24px; border-radius: 5px; }
.flag.wave { position: relative; overflow: hidden; }
.flag.wave::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.45) 40%, transparent 60%); transform: translateX(-120%); }

/* онбординг */
.ob { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.ob .orn { transform-origin: left; }
.ob-brand { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 0; }
.ob-track { flex: 1; min-height: 0; display: flex; transition: transform .5s cubic-bezier(.2, .8, .2, 1); touch-action: pan-y; }
.ob-slide { flex: 0 0 100%; min-width: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px 20px 8px; display: flex; flex-direction: column; }
.ob-slide h1 { font: 800 clamp(34px, 10.5vw, 46px)/1 var(--display); letter-spacing: -.035em; margin: 18px 0 10px; }
.ob-slide h2 { font-size: 26px; margin: 8px 0 6px; }
.ob-slide .lead { font-size: 16px; color: var(--hint); margin: 0; }
.couple { width: 100%; height: auto; display: block; border-radius: 26px; box-shadow: 0 20px 50px rgba(3, 10, 30, .5); }
.ob-img { width: 100%; aspect-ratio: var(--ar, 6 / 5); object-fit: cover; display: block; border-radius: 26px; box-shadow: 0 20px 50px rgba(3, 10, 30, .5); background: var(--deep); }
.ob-img.wide { --ar: 9 / 5; margin-bottom: 4px; }
.empty-img { width: min(240px, 70%); aspect-ratio: 4 / 3; object-fit: cover; border-radius: 20px; display: block; margin: 0 auto 18px; }
.countries { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.countries span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 7px; border-radius: 999px; background: var(--deep); font-size: 13.5px; font-weight: 600; }
.vs { display: grid; gap: 8px; margin-top: 16px; }
.vs-row { display: grid; grid-template-columns: 1fr 1fr; border-radius: 18px; overflow: hidden; background: var(--deep); }
.vs-row > div { padding: 11px 12px; font-size: 14px; line-height: 1.35; }
.vs-row .them { color: var(--hint); }
.vs-row .them s { text-decoration-color: rgba(226, 57, 75, .8); text-decoration-thickness: 1.5px; }
.vs-row .us { background: rgba(243, 196, 67, .1); font-weight: 600; }
.vs-row small { display: block; font-size: 11.5px; color: var(--hint); font-weight: 600; margin-bottom: 2px; }
.vs-head { display: grid; grid-template-columns: 1fr 1fr; font-size: 13px; font-weight: 700; padding: 0 12px; }
.vs-head span:last-child { color: var(--gold); display: flex; align-items: center; gap: 6px; }
.feat { display: grid; gap: 10px; margin-top: 16px; }
.feat > div { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; padding: 12px; border-radius: 18px; background: var(--deep); }
.feat i { width: 48px; height: 48px; border-radius: 15px; background: rgba(243, 196, 67, .12); display: grid; place-items: center; font-style: normal; font-size: 24px; }
.feat b { display: block; }
.feat span { color: var(--hint); font-size: 14px; }
.ob-foot { padding: 10px 20px calc(14px + var(--safe-bottom)); }
.ob-foot small { display: block; text-align: center; color: var(--hint); margin-top: 10px; font-size: 13px; }
.dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
.dots i { width: 7px; height: 7px; border-radius: 4px; background: var(--deep2); transition: width .3s, background .3s; }
.dots i.on { width: 22px; background: var(--gold); }
.ob-skip { color: var(--hint); font-size: 14px; font-weight: 600; padding: 6px 4px; }

/* штампи при свайпі, сердечка, конфеті */
.stamp { position: absolute; top: 36px; z-index: 3; padding: 6px 14px; border-radius: 12px; font: 800 26px/1 var(--display); border: 3px solid; opacity: 0; pointer-events: none; background: rgba(14, 30, 69, .35); }
.stamp.yes { left: 18px; color: var(--gold); border-color: var(--gold); transform: rotate(-12deg); }
.stamp.no { right: 18px; color: #FF8A95; border-color: #FF8A95; transform: rotate(12deg); }
.burst { position: fixed; z-index: 35; pointer-events: none; font-size: 18px; }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; }

@media (prefers-reduced-motion: no-preference) {
  .view.on { animation: viewIn .22s ease both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } }
  .card.enter { animation: cardIn .38s cubic-bezier(.2, .9, .3, 1.1) both; }
  @keyframes cardIn { from { opacity: 0; transform: scale(.93) translateY(10px); } }
  .card.out { transition: transform .32s cubic-bezier(.4, 0, .9, .4), opacity .32s; }
  .flag.wave { animation: flutter 2.6s ease-in-out infinite; transform-origin: left center; }
  @keyframes flutter { 50% { transform: skewY(-4deg) scaleX(.96); } }
  .flag.wave::after { animation: sheen 3.2s ease-in-out infinite 1s; }
  @keyframes sheen { 0% { transform: translateX(-120%); } 45%, 100% { transform: translateX(120%); } }
  .ob > .orn { animation: stitchIn 1.1s steps(18) both; }
  @keyframes stitchIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .ob-slide.on .rise { animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; }
  .ob-slide.on .rise:nth-child(2) { animation-delay: .08s; } .ob-slide.on .rise:nth-child(3) { animation-delay: .16s; } .ob-slide.on .rise:nth-child(4) { animation-delay: .24s; }
  .ob-slide.on .vs-row, .ob-slide.on .feat > div { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }
  .ob-slide.on .vs-row:nth-child(3), .ob-slide.on .feat > div:nth-child(2) { animation-delay: .09s; }
  .ob-slide.on .vs-row:nth-child(4), .ob-slide.on .feat > div:nth-child(3) { animation-delay: .18s; }
  .ob-slide.on .vs-row:nth-child(5), .ob-slide.on .feat > div:nth-child(4) { animation-delay: .27s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  .couple .float-heart path { animation: heartFloat 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes heartFloat { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.1); } }
  .couple .stars circle, .couple .win rect { animation: twinkle 2.8s ease-in-out infinite; }
  .couple .stars circle:nth-child(2n), .couple .win rect:nth-child(2n) { animation-delay: 1.1s; }
  .couple .stars circle:nth-child(3n), .couple .win rect:nth-child(3n) { animation-delay: 1.9s; }
  @keyframes twinkle { 50% { opacity: .25; } }
  .couple .sun { animation: glow 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes glow { 50% { transform: scale(1.07); opacity: .75; } }
  .couple .rib1, .couple .rib2 { animation: sway 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
  .couple .rib2 { animation-delay: .3s; }
  @keyframes sway { 50% { transform: rotate(7deg); } }
  .plan.best::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(110deg, transparent 30%, rgba(243, 196, 67, .22) 50%, transparent 70%); background-size: 250% 100%; animation: shimmer 3.4s ease-in-out infinite; pointer-events: none; }
  @keyframes shimmer { 0% { background-position: 130% 0; } 60%, 100% { background-position: -30% 0; } }
  .round.like.pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { 40% { transform: scale(1.18); } }
  .burst { animation: burst .9s cubic-bezier(.2, .8, .3, 1) forwards; }
  @keyframes burst { to { transform: translate(var(--x), var(--y)) scale(.6) rotate(var(--r)); opacity: 0; } }
  .confetti i { animation: fall var(--d) linear var(--delay) forwards; }
  @keyframes fall { to { transform: translate(var(--x), 110vh) rotate(var(--r)); } }
  .match.on h2 { animation: rise .5s cubic-bezier(.2, .8, .2, 1) .15s both; }
  .card.enter .tag.home { animation: rise .45s cubic-bezier(.2, .8, .2, 1) .25s both; }
}

.toast { position: fixed; left: 50%; bottom: calc(96px + var(--safe-bottom)); transform: translateX(-50%); background: var(--linen); color: var(--night); font-weight: 600; padding: 11px 16px; border-radius: 14px; z-index: 40; font-size: 14px; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
</style>
</head>
<body>
  <header class="top" id="top" hidden><div class="brand"><i aria-hidden="true"></i><span>Flirt<b>UA</b></span></div><div class="here" id="here"></div><button class="x-close" data-close aria-label="Закрити застосунок"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <section class="view on" id="feed">
    <div class="stage" id="stage"><div class="empty"><div class="loader"></div></div></div>
    <div class="actions" id="actions" hidden>
      <button class="round nope" id="bNope" aria-label="Далі"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="round like" id="bLike" aria-label="Подобається"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.7 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg></button>
      <button class="round super" id="bSuper" aria-label="Суперлайк з повідомленням"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5h18v11H3z"/><path d="M3.5 7l8.5 6.5L20.5 7"/></svg></button>
    </div>
  </section>
  <section class="view" id="likes"><div class="scroll" id="likesBox"></div></section>
  <section class="view" id="matches"><div class="scroll" id="matchesBox"></div></section>
  <section class="view" id="profile"><div class="scroll" id="profileBox"></div></section>

  <nav class="tabs" id="tabs" hidden>
    <button data-v="feed" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 16.5h6"/></svg>Анкети</button>
    <button data-v="likes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.3-8.9-8.6C1.7 8.2 3.6 5 7 5c1.9 0 3.3 1 5 2.8C13.7 6 15.1 5 17 5c3.4 0 5.3 3.2 3.9 6.4C19 15.7 12 20 12 20z"/></svg>Лайки<i class="dot" id="likesDot" hidden></i></button>
    <button data-v="matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Симпатії</button>
    <button data-v="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5" stroke-linecap="round"/></svg>Профіль</button>
  </nav>

  <div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
  <div class="match" id="match"></div>

<script>
(() => {
  const tg = window.Telegram?.WebApp;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const hap = (t = "light") => { try { tg?.HapticFeedback?.impactOccurred(t); } catch {} };
  const ok = t => { try { tg?.HapticFeedback?.notificationOccurred(t); } catch {} };
  function toast(m) { document.querySelectorAll(".toast").forEach(t => t.remove()); const d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
  const PREVIEW = new URLSearchParams(location.search).has("preview") && window.parent !== window;
  let api = async function (path, body) {
    const r = await fetch("/app/api/" + path, { method: body ? "POST" : "GET", headers: { "content-type": "application/json", "x-init-data": tg?.initData || "" }, body: body ? JSON.stringify(body) : undefined });
    let d = {}; try { d = await r.json(); } catch {}
    if (!r.ok) throw new Error(d.error || "Помилка " + r.status);
    return d;
  };
  // ---------- Telegram: на весь екран, без закриття свайпом вниз ----------
  const ver = v => { try { return !!tg?.isVersionAtLeast?.(v); } catch { return false; } };
  const mobile = ["android", "android_x", "ios"].includes(tg?.platform);
  function noSwipeClose() { try { if (ver("7.7")) tg.disableVerticalSwipes(); } catch {} }
  try { tg.ready(); tg.expand(); } catch {}
  noSwipeClose();
  try { tg.setHeaderColor?.("#0E1E45"); tg.setBackgroundColor?.("#0E1E45"); tg.setBottomBarColor?.("#0E1E45"); } catch {}
  if (mobile && ver("8.0") && !new URLSearchParams(location.search).has("preview")) {
    try { if (!tg.isFullscreen) tg.requestFullscreen(); } catch {}
    try { tg.lockOrientation(); } catch {}
  }
  // Android інколи знову вмикає свайпи після розгортання / зміни розміру — вимикаємо ще раз
  ["viewportChanged", "fullscreenChanged", "activated"].forEach(ev => { try { tg?.onEvent?.(ev, noSwipeClose); } catch {} });
  setTimeout(noSwipeClose, 400); setTimeout(noSwipeClose, 1500);
  // старі клієнти (до 7.7): не даємо прокрутці впертися у верх — тоді Telegram не сприймає це як жест «закрити»
  document.addEventListener("touchstart", e => {
    const el = e.target.closest?.(".scroll, .sheet, .wiz, .ob-slide, .sup-log");
    if (!el || el.scrollHeight <= el.clientHeight + 1) return;
    if (el.scrollTop <= 0) el.scrollTop = 1;
    else if (el.scrollTop + el.clientHeight >= el.scrollHeight) el.scrollTop = el.scrollHeight - el.clientHeight - 1;
  }, { passive: true });
  // хрестик «Закрити» — будь-де в застосунку
  document.addEventListener("click", e => { if (e.target.closest?.("[data-close]")) { hap("light"); try { tg?.close?.(); } catch {} } });

  // вишиванка: піксельний орнамент «хрестиком» — ромб і маленький ромбик, червоне й золоте
  function stitchSVG(rows, cell = 2, gap = .35) {
    const cs = getComputedStyle(document.documentElement);
    const col = { r: cs.getPropertyValue("--red").trim() || "#E2394B", g: cs.getPropertyValue("--gold").trim() || "#F3C443" };
    let rects = "";
    rows.forEach((row, y) => [...row].forEach((ch, x) => { if (col[ch]) rects += `<rect x="${x * cell + gap / 2}" y="${y * cell + gap / 2}" width="${cell - gap}" height="${cell - gap}" fill="${col[ch]}"/>`; }));
    const w = rows[0].length * cell, h = rows.length * cell;
    return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" shape-rendering="crispEdges">${rects}</svg>`)}")`;
  }
  function paintStitch() {
    const W = 18, rows = [];
    for (let y = 0; y < 9; y++) {
      let r = "", d = Math.abs(y - 4);
      for (let x = 0; x < W; x++) {
        const dx = Math.abs(x - 4), sx = Math.abs(x - 13);
        if (dx + d === 4) r += "r";                         // контур ромба
        else if (dx + d === 2) r += "g";                    // внутрішній ромб
        else if (dx === 0 && d === 0) r += "r";             // серцевина
        else if (sx + d === 2 && d <= 2) r += "g";          // маленький ромбик між мотивами
        else r += ".";
      }
      rows.push(r);
    }
    const heart = [".rr.rr.", "rrrrrrr", "rrgrrrr", ".rrrrr.", "..rrr..", "...r..."];
    const st = document.documentElement.style;
    st.setProperty("--stitch", stitchSVG(rows));
    st.setProperty("--stitch-heart", stitchSVG(heart, 2, .3));
  }
  paintStitch();

  let ME = null, card = null, nextCard = null, idx = 0, busy = false;

  // ---------- дизайн з адмінки: кольори, шрифти, тексти онбордингу, картинки екранів ----------
  let DESIGN = { assets: {}, slides: null };
  const FONT_W = { "Unbounded": "500;700;800", "Montserrat Alternates": "500;700;800", "Comfortaa": "500;700", "Playfair Display": "500;700;800", "Lora": "500;700",
    "Rubik": "400;500;600;700;800", "Manrope": "400;500;600;700;800", "Russo One": "400", "Onest": "400;500;600;700", "Montserrat": "400;500;600;700",
    "Nunito": "400;500;600;700", "Inter": "400;500;600;700", "Open Sans": "400;500;600;700", "Roboto": "400;500;700" };
  const assetUrl = slot => DESIGN.assets?.[slot] ? `/app/asset/${slot}?v=${DESIGN.assets[slot]}` : "";
  function applyDesign(d) {
    DESIGN = { ...DESIGN, ...(d || {}) };
    const st = document.documentElement.style, t = DESIGN.theme || {};
    const map = { night: "--night", glow: "--glow", deep: "--deep", deep2: "--deep2", gold: "--gold", gold_ink: "--gold-ink", red: "--red", linen: "--linen", hint: "--hint" };
    Object.entries(map).forEach(([k, v]) => t[k] && st.setProperty(v, t[k]));
    if (t.linen) st.setProperty("--line", `color-mix(in srgb, ${t.linen} 12%, transparent)`);
    const f = DESIGN.fonts || {};
    const fams = [f.display, f.body].filter(x => x && FONT_W[x]);
    if (fams.length) {
      const href = "https://fonts.googleapis.com/css2?" + [...new Set(fams)].map(x => `family=${encodeURIComponent(x).replace(/%20/g, "+")}:wght@${FONT_W[x]}`).join("&") + "&display=swap";
      let l = document.getElementById("dfonts"); if (!l) { l = document.createElement("link"); l.id = "dfonts"; l.rel = "stylesheet"; document.head.appendChild(l); }
      if (l.href !== href) l.href = href;
      if (f.display) st.setProperty("--display", `"${f.display}", "${f.body || "Onest"}", system-ui, sans-serif`);
      if (f.body) st.setProperty("--body", `"${f.body}", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`);
    }
    st.setProperty("--match-bg", assetUrl("match") ? `linear-gradient(color-mix(in srgb, var(--night) 55%, transparent), color-mix(in srgb, var(--night) 80%, transparent)), url("${assetUrl("match")}")` : "none");
    try { const n = t.night || "#0E1E45"; tg?.setHeaderColor?.(n); tg?.setBackgroundColor?.(n); tg?.setBottomBarColor?.(n); } catch {}
    paintStitch();
  }
  async function loadDesign() { try { const r = await fetch("/app/api/design"); if (r.ok) applyDesign(await r.json()); } catch {} }
  const plural = n => n % 10 === 1 && n % 100 !== 11 ? "людині" : "людям";

  async function boot() {
    await loadDesign();
    if (PREVIEW) return previewBoot();
    if (!tg?.initData) {
      // відкрито не так, як треба (напр. зі старої кнопки під полем вводу або в браузері)
      $("stage").innerHTML = `<div class="empty"><div><b>Відкрий застосунок ще раз</b>Натисни кнопку <b>«❤️ Знайомства»</b> зліва від поля вводу в чаті з ботом${tg?.platform && tg.platform !== "unknown" ? "" : " у Telegram"}.<br><br>${tg?.close ? `<button class="btn primary" id="cl">Закрити</button>` : ""}</div></div>`;
      if ($("cl")) $("cl").onclick = () => tg.close();
      return;
    }
    try { ME = await api("me"); } catch (e) { $("stage").innerHTML = `<div class="empty"><div><b>Не вдалося відкрити</b>${esc(e.message)}</div></div>`; return; }
    if (!ME.registered) return hello();
    $("tabs").hidden = false; showTop();
    setDot(ME.likes);
    const start = (location.hash || "").slice(1);
    if (start === "support") { go("profile"); openSupport(); }
    else if (["likes", "matches", "profile"].includes(start)) go(start); else loadNext();
  }
  const FLAGS = { "Україна": "ua", "Іспанія": "es", "Польща": "pl", "Німеччина": "de", "Чехія": "cz", "Італія": "it" };
  const flag = (country, cls = "") => FLAGS[country] ? `<i class="flag ${FLAGS[country]} ${cls}" aria-hidden="true"></i>` : "";
  function showTop() { $("top").hidden = false; $("here").innerHTML = (flag(ME.me?.country) || "📍") + " " + esc(ME.me?.city || ME.me?.country || "Поруч"); }

  // ---------- привітання для нових: з першої секунди видно, що це для наших за кордоном ----------
  // ---------- онбординг: з першої секунди видно, що це для наших за кордоном ----------
  const COUPLE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" class="couple" role="img" aria-label="Закохана пара українців дивиться на вечірнє місто за кордоном">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B3375"/><stop offset=".7" stop-color="#2C4C96"/><stop offset="1" stop-color="#E9A65A"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE38A"/><stop offset=".6" stop-color="#F3C443"/><stop offset="1" stop-color="#F3C443" stop-opacity="0"/></radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#132656"/><stop offset="1" stop-color="#0E1E45"/></linearGradient>
    <pattern id="vysh" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F5EEE2"/><path d="M4 1l3 3-3 3-3-3z" fill="#E2394B"/><rect x="3.4" y="3.4" width="1.2" height="1.2" fill="#0E1E45"/></pattern>
    <clipPath id="frame"><rect width="360" height="300" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="360" height="300" fill="url(#sky)"/>
    <g class="stars" fill="#F5EEE2"><circle cx="40" cy="36" r="1.4"/><circle cx="92" cy="22" r="1"/><circle cx="300" cy="30" r="1.5"/><circle cx="330" cy="70" r="1"/><circle cx="250" cy="18" r="1"/><circle cx="20" cy="90" r="1"/><circle cx="140" cy="50" r="1.1"/></g>
    <circle class="sun" cx="180" cy="190" r="92" fill="url(#sun)" opacity=".9"/>
    <circle cx="180" cy="190" r="44" fill="#FFD866"/>
    <!-- місто за кордоном: дахи, вежа, купол, пальми -->
    <g fill="#24407F">
      <path d="M0 214h28v-26l14-12 14 12v26h20v-40h22v40h14v-58l9-14 9 14v58h18v-30h26v30h10v-48a20 20 0 0 1 40 0v48h12v-36h30v36h18v-22l12-10 12 10v22h50v90H0z"/>

        idx = (e.clientX - r.left < r.width / 2) ? Math.max(0, idx - 1) : Math.min(card.media.length - 1, idx + 1);
        renderCard(); hap("soft");
      }
    };

  // сердечка з кнопки лайка
  function burst(btn) {
    if (!btn || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop");
    const r = btn.getBoundingClientRect();
    for (let n = 0; n < 9; n++) {
      const h = document.createElement("span"); h.className = "burst"; h.textContent = n % 3 ? "❤️" : (n % 2 ? "💛" : "💙");
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, d = 70 + Math.random() * 70;
      h.style.cssText = `left:${r.left + r.width / 2 - 9}px;top:${r.top + r.height / 2 - 12}px;--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d}px;--r:${(Math.random() - .5) * 90}deg`;
      document.body.appendChild(h); setTimeout(() => h.remove(), 950);
    }
  }
  $("bLike").onclick = () => act("like");

  async function act(action) {

    const el = $("card"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (action === "like") burst($("bLike"));

      const dir = action === "like" ? 1 : -1;
      el.querySelector(`.stamp.${action === "like" ? "yes" : "no"}`).style.opacity = 1;
      el.classList.remove("enter"); el.classList.add("out");
      requestAnimationFrame(() => { el.style.transform = `translateX(${dir * 140}%) rotate(${dir * 18}deg)`; el.style.opacity = 0; });
    }
    const flew = new Promise(r => setTimeout(r, el && !reduce ? 260 : 0));
    try {
      const [r] = await Promise.all([api("swipe", { id: c.id, action, incoming: c.incoming }), flew]);

      if (c.incoming && action) { ME.likes = Math.max(0, ME.likes - 1); setDot(ME.likes); }

  // ---------- спільне: фото, локація, правила ----------
  const H = { "x-init-data": tg?.initData || "" };
  const richText = s => esc(s).replace(/&lt;(\/?)(b|i)&gt;/g, "<$1$2>").replace(/\n/g, "<br>");
  async function compress(file) {
    if (!file.type.startsWith("image/")) return file;
    try {
      const img = await createImageBitmap(file);
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      return await new Promise(r => cv.toBlob(b => r(b || file), "image/jpeg", 0.86));
    } catch { return file; }
  }
  // якщо застосунок відкрили за посиланням без «Почати» — просимо дозволу боту писати (потрібно для фото й сповіщень про симпатії)
  let writeOk = !!tg?.initDataUnsafe?.user?.allows_write_to_pm;
  function askWrite() {
    if (writeOk || !tg?.requestWriteAccess) return Promise.resolve(true);
    return new Promise(res => tg.requestWriteAccess(g => { writeOk = !!g; res(writeOk); }));
  }
  async function uploadFile(file) {
    if (!(await askWrite())) throw new Error("Дозволь боту писати тобі — так ми збережемо фото й повідомимо про симпатії");
    if (file.type.startsWith("video/") && file.size > 20 * 1024 * 1024) throw new Error("Відео завелике (до 20 МБ, до 60 с)");
    const fd = new FormData(); fd.append("file", await compress(file), file.name || "photo.jpg");
    const r = await fetch("/app/api/upload", { method: "POST", headers: H, body: fd });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Не вдалося завантажити");
    return d;
  }
  function getLocation() {
    return new Promise((res, rej) => {
      const lm = tg?.LocationManager;
      const viaBrowser = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lon: p.coords.longitude }), () => rej(new Error("Не вдалося отримати локацію")), { timeout: 15000 }) : rej(new Error("Локація недоступна"));
      if (lm && lm.init) {
        lm.init(() => {
          if (!lm.isLocationAvailable) return viaBrowser();
          lm.getLocation(d => d ? res({ lat: d.latitude, lon: d.longitude }) : (lm.isAccessRequested && !lm.isAccessGranted ? rej(new Error("Дозволь доступ до локації в налаштуваннях бота")) : viaBrowser()));
        });
      } else viaBrowser();
    });
  }

  function mediaEditor(box, items, onChange) {
    const draw = () => {
      box.innerHTML = `<div class="mgrid">${[0, 1, 2].map(i => {
        const m = items[i];
        if (!m) return `<label class="mslot add">${items.uploading === i ? `<div class="loader"></div>` : `<span>＋</span><small>${i === 0 ? "Головне фото" : "Фото або відео"}</small>`}<input type="file" accept="image/*,video/*" ${i === items.length ? "" : "disabled"} hidden data-add></label>`;
        return `<div class="mslot" data-i="${i}">${m.t === "video" ? `<video src="${m.url}" muted playsinline loop autoplay></video>` : `<img src="${m.url}" alt="">`}
          ${i === 0 ? `<em>Головне</em>` : `<button class="mmain" data-main="${i}">Зробити головним</button>`}<button class="mdel" data-del="${i}" aria-label="Видалити">✕</button></div>`;
      }).join("")}</div><p class="muted" style="font-size:13px;margin:6px 2px 0">До 3 фото або відео до 60 с. Вертикальні фото виглядають найкраще.</p>`;
      box.querySelectorAll("[data-add]").forEach(inp => inp.onchange = async () => {

      { t: "Майже готово!", h: () => `<button class="btn" id="wLoc">${R.lat != null ? "✅ Локацію додано" : "📍 Показувати людей поруч"}</button><p class="muted">Інші бачать лише приблизну відстань у км, не адресу. Можна пропустити.</p>
          <label class="agree"><input type="checkbox" id="wAgree" ${R.agree ? "checked" : ""}> <span>Мені є 18 років, я погоджуюсь з <a href="#" id="wRules">правилами</a> і буду використовувати лише свої фото.</span></label>`,
        after: () => { $("wLoc").onclick = async () => { try { const l = await getLocation(); R.lat = l.lat; R.lon = l.lon; $("wLoc").textContent = "✅ Локацію додано"; ok("success"); } catch (e) { toast(e.message); } }; $("wRules").onclick = e => { e.preventDefault(); showRules(); }; },
        ok: () => (R.agree = $("wAgree").checked) || "Постав галочку, щоб продовжити" },
    ];
    const draw = () => {
      const s = steps[step];
      $("stage").innerHTML = `<div class="wiz"><div class="orn" aria-hidden="true" style="margin:0 -12px 12px"></div><div style="display:flex;justify-content:flex-end;margin:-4px 0 8px"><button class="x-close" data-close aria-label="Закрити застосунок"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="wbar">${steps.map((_, k) => `<i class="${k <= step ? "on" : ""}"></i>`).join("")}</div>
        ${step ? `<button class="wback" id="wBack">‹ Назад</button>` : ""}
        <h2>${s.t}</h2><div class="wbody">${s.h()}</div>
        <button class="btn primary" id="wNext">${step === steps.length - 1 ? "Створити анкету ❤️" : "Далі"}</button></div>`;
      $("stage").querySelectorAll("[data-k]").forEach(b => b.onclick = () => { R[b.dataset.k] = b.dataset.v; if (b.dataset.k === "hometown" && $("wHome")) $("wHome").value = ""; if ($("wCity")) R.city = $("wCity").value; if ($("wAbout")) R.about = $("wAbout").value; draw(); hap("soft"); });
      s.after && s.after();
      if (step) $("wBack").onclick = () => { step--; draw(); };
      $("wNext").onclick = async () => {
        const v = s.ok(); if (v !== true) return toast(v);
        if (step < steps.length - 1) { step++; return draw(); }
        $("wNext").disabled = true;
        try {
          await api("register", { ...R, media: R.media.map(m => ({ t: m.t, id: m.id, tok: m.tok, thumb: m.thumb })) });
          ok("success"); ME = await api("me"); $("tabs").hidden = false; showTop(); setDot(ME.likes);
          toast("🎉 Анкету створено!"); loadNext();
        } catch (e) { toast(e.message); $("wNext").disabled = false; }
      };
      const inp = $("stage").querySelector(".wbody input:not([type=checkbox]), .wbody textarea"); if (inp && step < 2) setTimeout(() => inp.focus(), 60);
    };
    $("actions").hidden = true;
    draw();
  }

  // ---------- профіль ----------
  function renderProfile() {
    const m = ME.me, f = ME.filters, box = $("profileBox");
    const free = m.freeUntil * 1000 > Date.now();
    const prem = m.premiumUntil * 1000 > Date.now();
    const opt = (v, cur, label) => `<option value="${esc(v)}" ${String(cur ?? "") === String(v) ? "selected" : ""}>${esc(label ?? v)}</option>`;
    const share = `https://t.me/share/url?url=${encodeURIComponent(ME.ref)}&text=${encodeURIComponent("Знайомства для українців за кордоном ❤️ Спробуй — тут багато наших поруч!")}`;
    const ph = (m.mediaRaw || [])[0]?.url || m.media?.[0]?.url || "";
    box.innerHTML = `
      <div class="me-head">${ph ? `<img src="${ph}" alt="">` : ""}<div><b>${esc(m.name)}, ${esc(m.age)}</b><span class="muted">${esc(m.hometown ? m.hometown + " → " : "")}${esc(m.city || m.country)}</span></div></div>
      <div class="prem">
        <h2 style="font-size:19px">${prem ? "💎 Преміум активний" : "💎 Преміум"}</h2>
        <p class="muted" style="margin:0">${prem ? `${untilText(m.premiumUntil)}. Бачиш усіх, хто тебе лайкнув. Можна продовжити — дні додадуться.` : "Побач усіх, кому ти сподобався(-лась), і відповідай взаємністю. Оплата зірками Telegram — не виходячи з застосунку."}</p>
        <div id="pPlans">${plansHtml() || `<p class="muted" style="margin:10px 0 0">Оплата тимчасово недоступна — запроси друга, щоб отримати Преміум.</p>`}</div>
      </div>
      <div class="sec">Фото</div>
      <div id="pMedia"></div>
      <div class="sec">Про тебе</div>
      <div class="two"><div class="field"><label>Ім'я</label><input id="pName" maxlength="30" value="${esc(m.name)}"></div><div class="field"><label>Вік</label><input id="pAge" type="number" inputmode="numeric" min="18" max="70" value="${esc(m.age)}"></div></div>
      <div class="two"><div class="field"><label>Країна</label><select id="pCountry">${ME.countries.map(c => opt(c, m.country)).join("")}</select></div><div class="field"><label>Місто</label><input id="pCity" maxlength="40" value="${esc(m.city)}" placeholder="Аліканте"></div></div>
      <div class="two"><div class="field"><label>Я</label><select id="pGender">${opt("m", m.gender, "Хлопець")}${opt("f", m.gender, "Дівчина")}</select></div><div class="field"><label>Шукаю</label><select id="pSearch">${opt("f", m.search, "Дівчину")}${opt("m", m.search, "Хлопця")}</select></div></div>
      <div class="field"><label>Звідки родом в Україні</label><input id="pHome" maxlength="40" value="${esc(m.hometown)}" placeholder="Львів"></div>
      <div class="field"><label>Про себе</label><textarea id="pAbout" maxlength="700">${esc(m.about)}</textarea></div>
      <button class="btn primary" id="save">Зберегти</button>
      <button class="btn" id="loc">${m.location ? "📍 Оновити локацію" : "📍 Додати локацію — люди поруч першими"}</button>
      <div class="sec">Статус</div>
      <div class="toggle"><div>☕️ Вільний(-а) сьогодні<small>24 години анкета вище, з позначкою «можна на каву»</small></div><button class="sw ${free ? "on" : ""}" id="tFree"></button></div>
      <div class="toggle"><div>⏸ Пауза<small>Тебе ніхто не бачить, поки пауза увімкнена</small></div><button class="sw ${m.paused ? "on" : ""}" id="tPause"></button></div>
      <div class="sec">Кого шукати</div>
      <div class="field"><label>Країна пошуку</label><select id="fCountry">${opt("", f.country, `Моя (${m.country})`)}${ME.countries.map(c => opt(c, f.country)).join("")}</select></div>
      <div class="two"><div class="field"><label>Вік від</label><input id="fMin" type="number" inputmode="numeric" min="18" max="70" value="${esc(f.min_age ?? "")}" placeholder="18"></div><div class="field"><label>до</label><input id="fMax" type="number" inputmode="numeric" min="18" max="70" value="${esc(f.max_age ?? "")}" placeholder="70"></div></div>
      <button class="btn" id="saveF">Застосувати фільтри</button>
      <div class="sec">Запроси друзів</div>
      <p style="margin:4px 2px">🎁 Коли друг створить анкету за твоїм посиланням, ви <b>обоє</b> отримаєте ${ME.premiumMinutes} хв Преміуму — побачите, хто вас лайкнув.</p>
      <p class="muted" style="margin:4px 2px">Ти вже запросив(-ла): <b>${ME.invited}</b></p>
      <div class="two"><button class="btn primary" id="share">📤 Надіслати другу</button><button class="btn" id="copy">🔗 Копіювати</button></div>
      <div class="sec">Ще</div>
      <button class="btn" id="support">💬 Підтримка${ME.supportUnread ? `<span class="badge-n">${ME.supportUnread}</span>` : ""}</button>
      <button class="btn" id="rules">📜 Правила і безпека</button>
      <button class="btn danger" id="del">🗑 Видалити анкету</button>`;
    const media = (m.mediaRaw || []).map(x => ({ ...x }));
    const onMedia = async items => {
      try { const r = await api("media", { media: items.map(x => ({ t: x.t, id: x.id, tok: x.tok, thumb: x.thumb })) }); m.mediaRaw = r.media; ok("success"); toast("✅ Фото збережено"); }
      catch (e) { toast(e.message); }
    };
    onMedia.needOne = true;
    mediaEditor($("pMedia"), media, onMedia);
    bindPlans($("pPlans"), () => view === "profile" && renderProfile());
    $("save").onclick = async () => {
      const body = { name: $("pName").value, age: $("pAge").value, country: $("pCountry").value, city: $("pCity").value, gender: $("pGender").value, search: $("pSearch").value, hometown: $("pHome").value, about: $("pAbout").value };
      try { await api("profile", body); Object.assign(ME.me, { ...body, age: +body.age }); nextCard = null; ok("success"); toast("✅ Збережено"); } catch (e) { toast(e.message); }
    };
    $("loc").onclick = async () => { try { const l = await getLocation(); await api("profile", l); m.location = true; $("loc").textContent = "📍 Оновити локацію"; ok("success"); toast("📍 Локацію оновлено"); } catch (e) { toast(e.message); } };
    $("tFree").onclick = async e => { const on = !e.target.classList.contains("on"); try { await api("profile", { free: on }); e.target.classList.toggle("on", on); ME.me.freeUntil = on ? Date.now() / 1000 + 86400 : 0; hap(); } catch (x) { toast(x.message); } };
    $("tPause").onclick = async e => { const on = !e.target.classList.contains("on"); try { await api("profile", { paused: on }); e.target.classList.toggle("on", on); ME.me.paused = on; hap(); toast(on ? "⏸ Анкету приховано" : "▶️ Анкета знову в пошуку"); } catch (x) { toast(x.message); } };
    $("saveF").onclick = async () => {
      const filters = { country: $("fCountry").value || null, min_age: $("fMin").value, max_age: $("fMax").value };
      try { await api("profile", { filters }); ME.filters = { country: filters.country, min_age: +filters.min_age || null, max_age: +filters.max_age || null }; nextCard = null; card = null; ok("success"); toast("Фільтри застосовано"); go("feed"); } catch (e) { toast(e.message); }
    };
    $("share").onclick = () => tg.openTelegramLink(share);
    $("copy").onclick = async () => { try { await navigator.clipboard.writeText(ME.ref); toast("🔗 Посилання скопійовано"); } catch { sheet(`<h2>Твоє посилання</h2><input value="${esc(ME.ref)}" readonly onclick="this.select()">`); } };
    $("rules").onclick = showRules;
    $("support").onclick = () => openSupport();
    $("del").onclick = () => {
      sheet(`<h2>Видалити анкету?</h2><p class="muted">Фото, лайки й симпатії буде стерто назавжди. Якщо хочеш перепочити — краще увімкни «⏸ Паузу».</p>
        <button class="btn" id="dPause">⏸ Краще пауза</button><button class="btn danger" id="dYes">🗑 Так, видалити назавжди</button>`);
      $("dPause").onclick = async () => { await api("profile", { paused: true }); ME.me.paused = true; closeSheet(); renderProfile(); toast("⏸ Анкету приховано"); };
      $("dYes").onclick = async () => { try { await api("delete", { confirm: "DELETE" }); closeSheet(); toast("Анкету видалено"); ME = await api("me"); $("tabs").hidden = true; card = nextCard = null; document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "feed")); wizard(); } catch (e) { toast(e.message); } };
    };
  }

  // ---------- попередній перегляд в адмінці: демо-дані, без Telegram, дизайн приходить через postMessage ----------
  function previewBoot() {
    const svgPh = (a, b) => "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 160"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="90" height="160" fill="url(#g)"/><circle cx="45" cy="62" r="17" fill="#E8B48F"/><path d="M28 60a17 17 0 0 1 34 0c0-12-7-20-17-20s-17 8-17 20z" fill="#4A2C1E"/><rect x="20" y="82" width="50" height="90" rx="22" fill="#24407F"/></svg>`);
    const P1 = svgPh("#F2B27A", "#6B4A7A"), P2 = svgPh("#8FC1F0", "#2B4A86"), P3 = svgPh("#CFE0A8", "#4F6E3E");
    const plans = [{ i: 0, days: 7, stars: 250, title: "тиждень", name: "Тиждень", eur: "5 €" }, { i: 1, days: 30, stars: 750, title: "місяць", name: "Місяць", eur: "15 €" }, { i: 2, days: 90, stars: 1750, title: "3 місяці", name: "3 місяці", eur: "35 €" }];
    ME = { registered: true, bot: "FlirtUa_bot", countries: ["Іспанія", "Польща", "Німеччина", "Чехія", "Італія"], reasons: { fake: "Фейк" }, premiumMinutes: 10, minAge: 18,
      hometowns: ["Київ", "Львів", "Харків", "Одеса", "Дніпро"], rules: "", disclaimer: "", plans, starEur: 0.02, invited: 2, name: "Оля", likes: 7, superlikeWait: 0, ref: "", supportUnread: 0,
      me: { id: "1", name: "Оля", age: 27, city: "Валенсія", country: "Іспанія", about: "", hometown: "Львів", media: [{ t: "photo", url: P2 }], mediaRaw: [{ t: "photo", id: "a", url: P2 }], gender: "f", search: "m", location: true, paused: false, freeUntil: 0, premiumUntil: 0 }, filters: {} };
    const CARD = { id: "2", name: "Андрій", age: 29, city: "Валенсія", country: "Іспанія", about: "Інженер, бігаю по набережній 🙂", hometown: "Львів", sameHome: true, free: true, dist: 3, incoming: false, note: "", media: [{ t: "photo", url: P1 }, { t: "photo", url: P3 }] };
    api = async (path) => path === "next" ? { card: { ...CARD } } : path === "likes" ? { count: 7, premium: false, items: [] }
      : path === "matches" ? [{ id: "3", name: "Марко", age: 31, city: "Мадрид", username: "marko", photo: P3 }] : path === "swipe" ? { match: { id: "2", name: "Андрій", username: "andriy", photo: P1 } } : {};
    let screen = "ob0";
    const show = name => {
      screen = name || screen;
      closeMatch(); closeSheet(); $("tabs").hidden = true; $("top").hidden = true; card = nextCard = null;
      document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "feed"));
      if (screen.startsWith("ob")) { hello(); const k = +screen.slice(2); for (let n = 0; n < k; n++) $("obNext").click(); return; }
      if (screen === "wizard") return wizard();
      $("tabs").hidden = false; showTop();
      if (screen === "empty") { const f = fetchNext; fetchNext = async () => null; loadNext().then(() => (fetchNext = f)); return; }
      if (screen === "match") { loadNext(); return showMatch({ id: "2", name: "Андрій", username: "andriy", photo: P1 }); }
      if (["likes", "matches", "profile"].includes(screen)) return go(screen);
      loadNext();
    };
    window.addEventListener("message", e => {
      if (e.origin !== location.origin) return;
      const m = e.data || {};
      if (m.type === "design") { applyDesign(m.design); show(); }
      if (m.type === "screen") show(m.name);
    });
    show(new URLSearchParams(location.search).get("screen") || "ob0");
    try { parent.postMessage({ type: "preview-ready" }, location.origin); } catch {}
  }

  boot();
})();
</script>
</body>
</html>
